name: probe (temporary)
on:
  push:
    branches: [claude/ai-artist-job-radar-github-938ydu]
    paths: [job-radar/scripts/_probe_sr.py, .github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
