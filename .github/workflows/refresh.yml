name: AI 잡 레이더 새로고침

on:
  schedule:
    - cron: "0 0 * * *" # 매일 한국시간 오전 9시 (UTC 00:00)
  workflow_dispatch:
    inputs:
      sources:
        description: "일부 사이트만 (예: saramin,wanted). 비우면 전체"
        required: false
        default: ""
      debug:
        description: "응답 로그 자세히 보기"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "job-radar/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: job-radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 수집이 필요한지 판단
        id: plan
        run: |
          # 스케줄·수동 실행은 항상 수집. push는 수집 코드가 바뀐 경우만 (insta.json·페이지만 고친 경우는 배포만).
          if [ "${{ github.event_name }}" != "push" ]; then echo "collect=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then echo "collect=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BEFORE" HEAD | grep -qE '^(job-radar/scripts/|\.github/workflows/refresh\.yml)'; then
            echo "collect=true" >> "$GITHUB_OUTPUT"
          else
            echo "collect=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.collect == 'true'
        with:
          python-version: "3.12"

      - name: 수집 실행
        if: steps.plan.outputs.collect == 'true'
        env:
          RADAR_SOURCES: ${{ github.event.inputs.sources }}
          RADAR_DEBUG: ${{ github.event.inputs.debug == 'true' && '1' || '0' }}
        run: |
          pip install -q -r job-radar/scripts/requirements.txt
          python job-radar/scripts/collect.py

      - name: 바뀐 데이터만 커밋
        if: steps.plan.outputs.collect == 'true'
        run: |
          git add job-radar/data/jobs.json job-radar/data/status.json job-radar/data/companies.json
          if git diff --cached --quiet; then
            echo "데이터 변화 없음 - 커밋하지 않고 종료"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: 잡 레이더 자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1

  deploy:
    needs: collect
    # GitHub Pages는 기본 브랜치에서만 배포
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }} # 방금 커밋한 최신 데이터 포함
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: job-radar
      - id: deployment
        uses: actions/deploy-pages@v4
